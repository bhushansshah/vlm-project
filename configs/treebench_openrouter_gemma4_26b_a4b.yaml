# TreeBench base pipeline (P1): Gemma 4 26B-A4B (MoE, ~4B active) via OpenRouter.
# Direct answer, no thinking, greedy. Pinned to unquantized (bf16) providers so the
# result doesn't depend on which provider OpenRouter routes to.
dataset: treebench
model: openrouter:google/gemma-4-26b-a4b-it
prompt: default
generation:
  temperature: 0
  max_tokens: 1024
  extra:
    reasoning: {enabled: false}
    provider: {quantizations: [bf16], require_parameters: true}
concurrency: 8
