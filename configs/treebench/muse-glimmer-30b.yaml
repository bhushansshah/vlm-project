# TreeBench base pipeline (P1): Muse Glimmer 30B (dense) via OpenRouter.
# This endpoint refuses requests with reasoning disabled ("Reasoning is mandatory"), so it
# runs with the lowest effort and a larger token budget: NOT directly comparable to the
# no-thinking runs. Greedy, pinned to unquantized (bf16) providers.
dataset: treebench
model: openrouter:meta/muse-glimmer-30b
prompt: default
generation:
  temperature: 0
  max_tokens: 8192
  extra:
    reasoning: {effort: low}
    provider: {quantizations: [bf16], require_parameters: true}
concurrency: 8
