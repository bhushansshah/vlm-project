# Local model behind a vLLM OpenAI-compatible server (much faster than in-process HF):
#   vllm serve Qwen/Qwen2.5-VL-7B-Instruct --limit-mm-per-prompt '{"image": 1}' --max-model-len 32768
model: vllm:Qwen/Qwen2.5-VL-7B-Instruct
model_options:
  base_url: http://localhost:8000/v1   # or http://<gpu-node>:8000/v1
prompt: default
generation:
  temperature: 0
  max_tokens: 512
concurrency: 16
