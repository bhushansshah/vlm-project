# Self-distillation traces for SFT arm A3: Qwen3.5-4B thinking on the SFT pool, same settings as the teacher.
# Data: training/build_data_v1.py -> data/train_v1/sft (TreeBench prompt format). Plan: docs/plans/treebench_sft_rl_plan.md.
dataset: tbstyle
data_dir: data/train_v1/sft
model: vllm:Qwen/Qwen3.5-4B
model_options:
  base_url: http://localhost:18432/v1
  timeout: 3600
run_name: train_v1__self-4b-think__sft
prompt: default
generation:
  max_tokens: 8192
  temperature: 1.0
  top_p: 0.95
  seed: 0
  extra:
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    chat_template_kwargs: {enable_thinking: true}
concurrency: 32
