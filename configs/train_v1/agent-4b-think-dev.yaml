# Dev-set evaluation of a tb3 agent (Qwen3.5-4B or an SFT checkpoint via --model), tested with thinking on.
# Same agent and sampling as ../treebench_h100/qwen3.5-4b-agent-tb3-think.yaml; only the dataset and run name differ.
dataset: tbstyle
data_dir: data/train_v1/dev
run_name: train_v1__base-4b-agent-think__dev
model: vllm:Qwen/Qwen3.5-4B
model_options:
  base_url: http://localhost:18431/v1
  timeout: 3600
prompt: default
generation:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 32768
  seed: 0
  extra:
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    chat_template_kwargs: {enable_thinking: true}
agent: tools
agent_options:
  instructions: tb3
  protocol: native
  instructions_in: system
  max_steps: 20
  step_max_tokens: 32768
concurrency: 16
