[project]
name = "vlmbench"
version = "0.1.0"
description = "Model-agnostic VLM inference pipelines for the VisualOverload dense-scene VQA benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0",
    "pyarrow>=15",
    "pillow>=10",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]            # OpenAI, OpenRouter, and any OpenAI-compatible local server (vLLM, SGLang, Ollama, LM Studio)
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
api = ["vlmbench[openai,anthropic,gemini]"]
local = [
    "torch>=2.4",
    "transformers>=4.57",
    "accelerate>=1.0",
]
dev = ["pytest>=8"]
all = ["vlmbench[api,local,dev]"]

[project.scripts]
vlmbench = "vlmbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
